# /etc/nginx/sites-available/marron-portfolio
#
# 役割はTLS終端とHonoアプリへのリバースプロキシ。
#
# 使い方:
#   1. server_name / ssl_certificate のパスを実際のものに差し替える
#   2. ln -s /etc/nginx/sites-available/marron-portfolio /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx

server {
	listen 80;
	listen [::]:80;
	server_name example.com;

	# ACME(certbot)のHTTP-01チャレンジ用。それ以外は常にHTTPSへ。
	location /.well-known/acme-challenge/ {
		root /var/www/acme-challenge;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name example.com;

	ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	client_max_body_size 4m;

	location / {
		proxy_pass http://127.0.0.1:3010;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

	}
}
